name: CI

on:
  push:
    branches: [vnext]
  pull_request:
    branches: [vnext]

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/IgBlazorSamples.Gulp/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Copy samples to the browser client
        working-directory: browser/IgBlazorSamples.Gulp
        run: |
          npm ci
          npx gulp copySamplesToClient

      - name: Build SamplesBrowser
        working-directory: browser
        run: dotnet build IgBlazorSamplesBrowser.sln

      - name: Build tests
        working-directory: browser
        run: dotnet build IgBlazorSamples.Test.sln

      - name: Install Playwright Chromium
        working-directory: browser/IgBlazorSamples.Test
        run: pwsh bin/Debug/playwright.ps1 install --with-deps chromium

      - name: Run tests
        working-directory: browser/IgBlazorSamples.Test
        run: dotnet test --no-build --settings ../.runsettings --logger "console;verbosity=normal" --logger trx --results-directory TestResults -- Playwright.LaunchOptions.Headless=true

      - name: Upload test results and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            browser/IgBlazorSamples.Test/TestResults
            browser/IgBlazorSamples.Test/bin/Debug/playwright-traces
          if-no-files-found: ignore
