# Validates the samples browser: copies the samples into the client, builds it and runs the browser tests.
trigger:
  branches:
    include:
    - vnext

pr:
  branches:
    include:
    - vnext

name: $(BuildDefinitionName)_$(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

pool:
  name: BuildAgentOnPrem
  demands:
  - Agent.ComputerName -equals IGBGSOFBUILD90

variables:
  testDir: '$(Build.SourcesDirectory)/browser/IgBlazorSamples.Test'

jobs:
- job: BuildAndValidate
  displayName: 'Build & Validate'
  steps:
  # Same checkout as the deployment pipelines: the gulp processes rely on the repository folder name.
  - checkout: self
    path: $(Build.Repository.Name)
    fetchDepth: 1

  # Copies the samples into the client, pins the trial packages to igVersion, restores them from the IG feed
  # and publishes the client. Cleanup is left to the end of this job, so the tests can run.
  - template: templates/build-steps-template.yml
    parameters:
      igVersion: '26.2.2'
      igNuGetFeedUrl: $(IG_Nuget_Feed_URL)
      projectToBuild: Client
      shouldCleanPostExectuion: false
      useTrialPackages: true
      username: $(IG_Nuget_Feed_Username)
      password: $(IG_Nuget_Feed_Password)

  # Builds TestServer and, through it, Client, Core and Shared.
  - script: dotnet build
    displayName: 'Build tests'
    workingDirectory: '$(testDir)'

  - pwsh: ./bin/Debug/playwright.ps1 install --with-deps chromium
    displayName: 'Install Playwright Chromium'
    workingDirectory: '$(testDir)'

  - script: >-
      dotnet test --no-build --settings ../.runsettings
      --logger "console;verbosity=normal" --logger trx --results-directory TestResults
      -- Playwright.LaunchOptions.Headless=true
    displayName: 'Run tests'
    workingDirectory: '$(testDir)'

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(testDir)/TestResults'
      testRunTitle: 'Samples browser tests'
      failTaskOnMissingResultsFile: false

  - task: CopyFiles@2
    displayName: 'Collect test results and traces'
    condition: failed()
    inputs:
      SourceFolder: '$(testDir)'
      Contents: |
        TestResults/**
        bin/Debug/playwright-traces/**
      TargetFolder: '$(Build.ArtifactStagingDirectory)/browser-test-results'

  - task: PublishPipelineArtifact@1
    displayName: 'Upload test results and traces'
    condition: failed()
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/browser-test-results'
      artifact: 'browser-test-results'

  - task: PostBuildCleanup@4
    displayName: 'Clean pipeline directories'
    condition: always()
